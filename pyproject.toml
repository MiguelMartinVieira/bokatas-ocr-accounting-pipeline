[project]
name = "bokatas-ocr-accounting-pipeline"
version = "0.1.0"
description = "Multimodal AI pipeline autonomously ingesting and reconciling supplier receipts into general ledgers for NGO Asociación Bokatas"
readme = "README.md"
authors = [
    { name = "Miguel Martín Vieira", email = "miguel.martin.vieira@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "google-genai>=0.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
